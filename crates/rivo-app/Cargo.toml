[package]
name = "rivo-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "rivo"
path = "src/main.rs"

[dependencies]
rivo-agent = { path = "../rivo-agent" }
serde_json = "1"
rune = { path = "../../vendor/rune/crates/rune", default-features = false, features = ["accessibility", "dbus"] }
rune-kit = { path = "../../vendor/rune/crates/rune-kit", features = ["markdown"] }
rune-theme-opencode = { path = "../../vendor/rune/themes/opencode" }
