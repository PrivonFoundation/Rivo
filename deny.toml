# cargo-deny policy for Rivo.
#
#   cargo deny check
#
# The same rules run in .github/workflows/dependency-scan.yml on every push and
# pull request. Checks:
#   advisories - RustSec vulnerabilities and yanked crates
#   licenses   - only the allow-list below may appear in the dependency tree
#   bans       - duplicate major versions and wildcard requirements
#   sources    - crates must come from crates.io or a workspace path patch

[graph]
all-features = false
targets = []

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93
private = { ignore = false }

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all-duplicates"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []