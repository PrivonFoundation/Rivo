[workspace]
resolver = "3"
members = ["crates/rivo-agent", "crates/rivo-app"]
exclude = ["vendor/rune"]

# Rune patches three published crates. A dependency's `[patch]` does not apply to the
# workspace that depends on it, so an app that builds Rune has to repeat these here.
# See the note in Rune's root Cargo.toml.
[patch.crates-io]
wgpu-hal = { path = "vendor/rune/vendor/wgpu-hal" }
winit = { path = "vendor/rune/vendor/winit" }
parley_engine = { path = "vendor/rune/vendor/parley_engine" }
accesskit_windows = { path = "vendor/rune/vendor/accesskit_windows" }
accesskit_macos = { path = "vendor/rune/vendor/accesskit_macos" }

[workspace.package]
edition = "2021"
license = "MIT"

[profile.dev]
debug = "line-tables-only"
